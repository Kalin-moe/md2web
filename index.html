<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>md2web · Title</title>
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            line-height: 1.65;
            font-size: 1rem;
            color: #111;
            background: #faf9f8;
            padding: 1.5rem 1rem;
        }

        .markdown-body {
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.03);
            padding: 1.2rem 1.2rem 2rem 1.2rem;
        }

        .markdown-body,
        .markdown-body * {
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body p,
        .markdown-body ul,
        .markdown-body ol,
        .markdown-body blockquote,
        .markdown-body pre,
        .markdown-body table,
        .markdown-body hr {
            margin-bottom: 1.25rem;
        }

        .markdown-body h1 {
            font-size: 2rem;
            line-height: 1.2;
            letter-spacing: -0.01em;
            font-weight: 700;
            margin-top: 0.2rem;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.4rem;
            margin-top: 1.8rem;
            font-weight: 600;
        }
        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.4rem;
        }

        .markdown-body a {
            color: #0366d6;
            text-decoration: none;
        }
        .markdown-body a:hover {
            text-decoration: underline;
        }

        .markdown-body pre {
            background: #f6f8fa;
            border-radius: 12px;
            padding: 1rem;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.45;
            border: 1px solid #eef2f5;
        }
        .markdown-body code {
            background: #f0f0f0;
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            font-family: 'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: 0.85em;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1.8rem auto;
            border-radius: 16px;
        }

        .markdown-body table {
            display: block;
            overflow-x: auto;
            white-space: nowrap;
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1.25rem;
        }
        .markdown-body th,
        .markdown-body td {
            border: 1px solid #e2e8f0;
            padding: 0.6rem 0.8rem;
            text-align: left;
        }
        .markdown-body th {
            background-color: #f8fafc;
            font-weight: 600;
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 1.75rem;
            margin-bottom: 1.25rem;
        }
        .markdown-body li {
            margin: 0.3rem 0;
        }

        .markdown-body blockquote {
            border-left: 4px solid #cbd5e1;
            padding-left: 1.2rem;
            color: #334155;
            margin-left: 0;
            background: #fefefe;
            border-radius: 0 12px 12px 0;
        }

        .markdown-body hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ddd, transparent);
            margin: 1.8rem 0;
        }

        .loading-msg {
            text-align: center;
            color: #6c757d;
            padding: 3rem 1rem;
            background: #fef9e6;
            border-radius: 28px;
        }

        .markdown-body input[type="checkbox"] {
            margin-right: 0.5rem;
            transform: translateY(2px);
            pointer-events: none;
        }
        .markdown-body .task-list-item {
            list-style-type: none;
            margin-left: -1.2rem;
        }

        @media (min-width: 768px) {
            body {
                padding: 2.5rem 2rem;
            }
            .markdown-body {
                max-width: 780px;
                padding: 2rem 2.2rem 2.5rem 2.2rem;
            }
        }

        @media (min-width: 1200px) {
            .markdown-body {
                max-width: 1000px;
                padding: 2.2rem 2.8rem 3rem 2.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="markdown-body" id="markdown-content">
        <div class="loading-msg">
            🌙 loading...
        </div>
    </div>

    <script>
        (function() {
            if (typeof showdown === 'undefined') {
                document.getElementById('markdown-content').innerHTML =
                    '<div style="color: #b91c1c; padding: 1.5rem;">❌ Showdown err</div>';
                return;
            }

            const converter = new showdown.Converter();

            converter.setOption('tables', true);
            converter.setOption('simplifiedAutoLink', true);
            converter.setOption('strikethrough', true);
            converter.setOption('tasklists', true);
            converter.setOption('emoji', true);
            converter.setOption('openLinksInNewWindow', true);
            converter.setOption('ghCompatibleHeaderId', true);
            converter.setOption('parseImgDimensions', true);

            fetch('doc.md')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.text();
                })
                .then(markdownText => {
                    const html = converter.makeHtml(markdownText);
                    document.getElementById('markdown-content').innerHTML = html;
                })
                .catch(error => {
                    console.error('Load failed:', error);
                    document.getElementById('markdown-content').innerHTML = `
                        <div style="background: #fff5f0; border-radius: 28px; padding: 1.8rem; text-align: center;">
                            <div style="font-size: 2.5rem;">📄</div>
                            <h3 style="color: #b45309;">doc.md not found</h3>
                            <p style="margin-top: 1rem; font-size:0.9rem;">
                                Create a <strong>doc.md</strong> file in the root directory<br><br>
                                <span style="background: #f0e4d8; padding: 0.3rem 0.8rem; border-radius: 8px; display: inline-block;">
                                💡 Line break tip: two spaces at end of line + Enter = line break<br>
                                Blank line = new paragraph
                                </span>
                            </p>
                        </div>
                    `;
                });
        })();
    </script>
</body>
</html>
